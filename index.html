<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>charity: water - Start Knowing Your Impact</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Adobe Fonts (Proxima Nova) -->
    <link rel="stylesheet" href="https://use.typekit.net/[YOUR-KIT-CODE].css">
</head>
<body>
    <!-- Header with logo and navigation -->
    <header class="site-header">
        <div class="header-inner">
            <a href="/" class="logo">
                <!-- Replace with actual logo once available -->
                <img src="img/charitywater_logo_horizontal_WhiteText.png" alt="charity: water" class="logo-image">
            </a>
            <nav class="header-nav">
                <a href="#" class="btn btn-secondary">SIGN IN</a>
                <a href="#" class="btn btn-primary">DONATE</a>
            </nav>
        </div>
    </header>

    <!-- Hero Section with impact message -->
    <section class="hero">
        <div class="hero-content">
            <div class="hero-text">
                <h1 class="hero-title">
                    <span class="text-highlight">STOP</span> WONDERING IF<br>
                    YOUR DONATION<br>
                    <span class="text-normal">MATTERS.</span><br>
                    <span class="text-highlight">START</span> KNOWING.
                </h1>
                <p class="hero-sub">
                    Fund clean water projects with 100% transparency, connect with the
                    communities you help, and build your network of changemakers who are
                    solving the global water crisis together.
                </p>
            </div>
            <div class="hero-image">
                <!-- Placeholder image - replace with actual project photo -->
                <img src="img/4750_Ethiopia_2019_CG-.jpg" 
                     alt="Clean water project impact" class="impact-photo">
            </div>
        </div>
        <!-- Donation amount form -->
        <div class="signup-form">
            <form action="#" method="POST" class="form-inline">
                <input type="text" placeholder="Give $30 to fund clean water today" class="form-input" required>
                <button type="submit" class="btn btn-accent">DONATE NOW</button>
            </form>
        </div>
        <div class="hero-shape"></div>
    </section>
</body>
</html>
